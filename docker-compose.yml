version: "3.9"

services:
  icecast-checker:
    build: .
    container_name: icecast-checker
    restart: always
    working_dir: /app
    volumes:
      # Рабочий конфиг (с секретами) на хосте
      - ./config.json:/app/config.json:ro
      # JSON со статусом потоков
      - ./status-online.json:/app/status-online.json
      # Логи: отдельная папка рядом с docker-compose.yml
      - ./logs:/var/log/scripts/check_streaming
    environment:
      # Пример: часовой пояс контейнера (опционально)
      - TZ=Europe/Moscow
    # Проверка "живости" сервиса
    healthcheck:
      test: ["CMD", "python", "global-checker.py", "--once"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    # Ограничения и ротация логов Docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitor_net

networks:
  monitor_net:
    driver: bridge

