# Single image for all servers: build tag icecast-checker:latest.
# Each server has its own config.json and volumes (logs, status-online.json).
services:
  icecast-checker:
    image: icecast-checker:latest
    build: .
    container_name: icecast-checker
    restart: always
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./status-online.json:/app/status-online.json
      - ./logs:/var/log/scripts/check_streaming
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "python", "global-checker.py", "--once"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitor_net

networks:
  monitor_net:
    driver: bridge

